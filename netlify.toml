# Staff pages are password-protected by netlify/edge-functions/staff-gate.ts (set STAFF_PASSWORD in Netlify).

# Internal staff pages: keep them out of search engines
[[headers]]
  for = "/reception-*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/scheduling-new-client"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/crisis-call"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"


[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
