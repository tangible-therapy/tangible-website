<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sample Practice | Tangible Orientation</title>
<!-- Practice copy of SimplePractice for staff training. All clients are made up; nothing is sent anywhere. Linked from the "Simple Practice" orientation lesson. Source of truth for edits: this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
[hidden]{display:none!important}

/* Layout: practice-management app shell. Left icon rail · top bar · workspace, plus a separate practice-guide column. Light UI by design (mirrors the real tool). */
:root{
  --text:#444444; --text-strong:#333333; --muted:#707070; --muted-2:#bbbbbb;
  --blue:#1371c8; --blue-dark:#1166b4; --blue-tint:#e7f1f9;
  --line:#dddddd; --line-soft:#f2f2f2; --rail:#f8f8f8; --chip:#f8f8f8; --btn2:#f2f2f2; --panel:#ffffff; --page:#ffffff;
  --ev-up:#accdec; --ev-up-t:#0a3864; --ev-show:#ade9cd; --ev-show-t:#0a6038; --ev-bad:#f8baae; --ev-bad-t:#751c0c; --ev-can:#ffe9ae; --ev-can-t:#80600c; --ev-other:#cdd5d9; --ev-other-t:#384349;
  --pill-show:#e7f9f1; --pill-bad:#fdebe8; --pill-can:#fff9e8; --badge:#f1f3f4; --badge-t:#384349;
  --guide:#fff8dc; --guide-line:#e8c95c; --focus:#f0a400; --err:#b3261e; --err-bg:#fdebe8; --ok:#0a6038; --ok-bg:#e7f9f1;
  --font:system-ui,"Segoe UI",Roboto,Ubuntu,Cantarell,"Helvetica Neue",Helvetica,Arial,sans-serif;
  --hour:64px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--text);font:14px/1.45 var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{display:grid;grid-template-columns:66px minmax(0,1fr) 330px;grid-template-rows:56px minmax(0,1fr) 30px;height:100%}
.app.nav-open{grid-template-columns:220px minmax(0,1fr) 330px}
.app.guide-min{grid-template-columns:66px minmax(0,1fr) 44px}
.app.nav-open.guide-min{grid-template-columns:220px minmax(0,1fr) 44px}
/* left rail */
.rail{grid-row:1/4;background:var(--rail);border-right:1px solid var(--line-soft);display:flex;flex-direction:column;padding:12px 12px 10px;padding-left:max(12px,env(safe-area-inset-left,0px));min-height:0;overflow:hidden auto}
.rail .toggle{width:32px;height:32px;border:0;background:var(--rail);border-radius:4px;display:grid;place-items:center;margin-left:5px;color:#000}
.rail .toggle:hover{background:#eee}
.rail .brand{display:none;font-weight:700;font-size:16px;color:var(--text-strong);letter-spacing:-.01em;padding:4px 6px;white-space:nowrap}
.rail .brand i{font-style:normal;color:var(--blue)}
.app.nav-open .rail .top{display:flex;align-items:center;justify-content:space-between}
.app.nav-open .rail .brand{display:block}
.rail hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.rail nav{display:grid;gap:4px}
.rail nav button{display:flex;align-items:center;gap:12px;height:36px;border:0;background:transparent;border-radius:3px;padding:0 12px;color:#384349;position:relative;white-space:nowrap;text-align:left}
.rail nav button:hover{background:#eee}
.rail nav button[aria-current="page"]{background:var(--blue-tint);color:var(--blue-dark);font-weight:600}
.rail nav button svg{width:18px;height:18px;flex:none}
.rail nav button .lbl{display:none}
.app.nav-open .rail nav button .lbl{display:inline}
.rail .cnt{position:absolute;left:24px;top:2px;background:#d93b2b;color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 4px;line-height:14px}
.app.nav-open .rail .cnt{position:static;margin-left:auto;font-size:11px;padding:0 6px;line-height:16px}
.rail nav button .tip{display:none}
.app:not(.nav-open) .rail nav button:hover .tip{display:block;position:fixed;left:62px;background:#333;color:#fff;font-size:12px;padding:3px 8px;border-radius:4px;z-index:80;pointer-events:none;font-weight:500}
/* top bar */
.topbar{grid-column:2;display:flex;align-items:center;gap:12px;padding:0 24px 0 24px;border-bottom:1px solid var(--line-soft);background:#fff;min-width:0}
.search{display:flex;align-items:center;gap:6px;background:var(--btn2);border-radius:4px;padding:6px 10px;width:220px;color:var(--muted);min-width:0}
.search input{border:0;background:transparent;outline:0;width:100%;color:var(--text-strong)}
.topbar .sp{flex:1}
.income{border:0;background:transparent;text-align:left;line-height:1.15;color:var(--muted);font-size:12px;border-radius:20px;padding:4px 10px}
.income b{display:block;color:var(--text-strong);font-size:14px}
.circ{width:36px;height:34px;border-radius:20px;border:0;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:20px;line-height:1}
.msgs{height:36px;border-radius:20px;border:0;background:var(--blue);color:#fff;display:flex;align-items:center;gap:8px;padding:0 16px;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;border:0;background:#384349;color:#fff;font-weight:600;font-size:13px}
/* main */
.main{grid-column:2;grid-row:2;min-width:0;min-height:0;overflow:auto;position:relative}
.foot{grid-column:2;grid-row:3;border-top:1px solid var(--line-soft);display:flex;align-items:center;gap:10px;padding:0 24px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.foot b{color:var(--text-strong)}
.foot .sp{flex:1}
.foot button{border:0;background:none;color:var(--blue);font-weight:600;font-size:12px;padding:0}
.foot button.armed{color:var(--err)}
.pad{padding:16px 24px 40px}
/* shared controls */
.btn{border:0;border-radius:4px;height:32px;padding:0 14px;font-weight:600;background:var(--btn2);color:var(--text-strong);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--blue);color:#fff}
.btn.link{background:transparent;color:var(--blue);padding:0 4px}
.btn.chip{background:var(--chip);font-weight:600}
.btn.chip.on{background:var(--blue-tint);color:var(--blue-dark)}
.btn.small{height:26px;font-size:12px;padding:0 10px}
.inp{height:32px;border:1px solid var(--line);border-radius:4px;background:#fff;padding:0 10px;width:100%;min-width:0;color:var(--text-strong)}
textarea.inp{height:auto;min-height:64px;padding:8px 10px;resize:vertical}
select.inp{padding-right:28px}
.lab{display:block;color:var(--text-strong);margin-bottom:6px}
.lab.b{font-weight:600}
.field{margin-bottom:14px}
.row2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{display:inline-block;background:var(--badge);color:var(--badge-t);font-size:11px;border-radius:11px;padding:0 8px;line-height:16px;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:14px;height:24px;padding:0 12px;font-weight:600;font-size:12px}
.pill.show{background:var(--pill-show);color:var(--ev-show-t)} .pill.bad{background:var(--pill-bad);color:var(--ev-bad-t)} .pill.can{background:var(--pill-can);color:var(--ev-can-t)}
.check{display:flex;align-items:center;gap:8px;color:var(--text-strong);margin:4px 0}
.check input{width:16px;height:16px;accent-color:var(--blue);margin:0}
.sep{border:0;border-top:1px solid var(--line-soft);margin:20px 0}
.h1{font-size:28px;font-weight:600;color:var(--text-strong);margin:0;letter-spacing:-.01em}
.crumb{font-size:14px;color:var(--muted);margin-bottom:14px}
.crumb a,.crumb button{color:var(--blue);border:0;background:none;padding:0;font-weight:500}
/* calendar */
.calbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:24px 24px 0}
.calbar h2{font-size:24px;font-weight:500;color:var(--text);margin:0 6px}
.calbar .tod{height:32px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 14px;color:var(--muted)}
.calbar .arr{width:24px;height:26px;border:0;background:#fff;border-radius:4px;color:var(--muted);font-size:16px}
.calbar .arr:hover,.calbar .tod:hover{background:var(--btn2)}
.views{display:flex;gap:2px;margin-left:auto}
.views button{width:60px;height:26px;border:0;background:transparent;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;border-radius:4px 4px 0 0}
.views button.on{color:var(--blue)}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px 16px}
.calpage{display:flex;flex-direction:column;height:100%}
.cal{margin:0 24px;border-top:1px solid #ccc;flex:1;min-height:0;overflow:auto}
.calhead{display:grid;grid-template-columns:69px repeat(var(--days),minmax(0,1fr));position:sticky;top:0;background:#fff;z-index:4}
.calhead div{height:26px;line-height:26px;font-weight:600;font-size:14px;padding-left:8px;border-left:1px solid #ccc;white-space:nowrap;overflow:hidden}
.calhead div:first-child{border-left:0}
.calhead .today{color:var(--blue)}
.allday{display:grid;grid-template-columns:69px repeat(var(--days),minmax(0,1fr));height:34px;border-top:1px solid #ccc;border-bottom:1px solid #ccc}
.allday div{border-left:1px solid #ccc;font-size:12px;color:var(--muted);padding:9px 6px}
.allday div:first-child{border-left:0;text-align:right}
.tgrid{display:grid;grid-template-columns:69px repeat(var(--days),minmax(0,1fr))}
.tlabels div{height:var(--hour);font-size:12px;color:var(--muted);text-align:right;padding-right:6px;transform:translateY(-8px)}
.tlabels div:first-child{visibility:hidden}
.dcol{position:relative;border-left:1px solid #ccc}
.dcol .slot{display:block;width:100%;height:calc(var(--hour) / 4);border:0;background:transparent;padding:0;border-top:1px solid transparent}
.dcol .slot:nth-child(4n+1){border-top-color:#ddd}
.dcol .slot:nth-child(4n+3){border-top:1px dotted #eee}
.dcol .slot:hover{background:#f6f9fc}
.dcol.today{background:#fcfdff}
.ev{position:absolute;left:1px;right:2px;border:0;border-radius:4px;box-shadow:0 0 0 1px #fff;padding:3px 4px 0 9px;text-align:left;font-size:11px;line-height:1.25;overflow:hidden;z-index:2;color:var(--ev-up-t);background:var(--ev-up)}
.ev .t{display:block}
.ev .n{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev.show{background:var(--ev-show);color:var(--ev-show-t)} .ev.bad{background:var(--ev-bad);color:var(--ev-bad-t)} .ev.can{background:var(--ev-can);color:var(--ev-can-t)}
.ev .ic{position:absolute;right:4px;top:3px;width:12px;height:12px}
.nowl{position:absolute;left:0;right:0;border-top:1px solid var(--blue);z-index:3}
.nowl::before{content:"";position:absolute;left:-4px;top:-4px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
.daytabs{display:none;gap:4px;padding:0 24px 10px;overflow-x:auto}
.daytabs button{border:1px solid var(--line);background:#fff;border-radius:4px;padding:3px 8px;font-size:12px;min-width:46px}
.daytabs button.on{border-color:var(--blue);color:var(--blue);font-weight:600}
/* popover */
.pop{position:fixed;z-index:50;width:432px;max-width:calc(100vw - 16px);background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 24px rgb(0 0 0 / .14);display:flex;flex-direction:column}
.pop .body{padding:24px;overflow:auto}
.pop .x{position:absolute;right:12px;top:14px;border:0;background:none;font-size:20px;color:var(--muted);width:28px;height:28px;border-radius:4px}
.pop .x:hover{background:var(--btn2)}
.pop .foot2{display:flex;align-items:center;gap:8px;padding:12px 24px;border-top:1px solid var(--line-soft)}
.pop .foot2 .sp{flex:1}
.ctitle{font-size:20px;font-weight:600;color:var(--blue);border:0;background:none;padding:0;text-align:left}
.ptabs{display:flex;gap:18px;border-bottom:1px solid var(--line-soft);margin:-4px 0 18px}
.ptabs button{border:0;background:none;padding:0 0 10px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent}
.ptabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.seg2{display:flex;gap:8px;margin-bottom:18px}
.seg2 button{height:28px;padding:0 12px;font-size:12px;border-radius:4px;border:1px solid var(--line);background:#fff}
.seg2 button.on{background:var(--blue-tint);color:var(--blue);font-weight:600;border-color:transparent}
.ddwrap{position:relative}
.ddbtn{width:100%;height:32px;border:1px solid var(--line);border-radius:4px;background:#fff;text-align:left;padding:0 10px;display:flex;align-items:center;gap:8px;color:var(--text-strong)}
.ddbtn.ph{color:var(--muted-2)}
.ddbtn::after{content:"";margin-left:auto;border:4px solid transparent;border-top:5px solid var(--muted);transform:translateY(3px)}
.ddlist{position:absolute;left:0;right:0;top:34px;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgb(0 0 0 / .12);z-index:60;max-height:300px;overflow:auto;padding:4px 0}
.ddlist .srch{padding:6px 8px;border-bottom:1px solid var(--line-soft)}
.ddlist button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:7px 14px;color:var(--text-strong)}
.ddlist button:hover{background:var(--blue-tint)}
.ddlist .grp{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:10px 14px 4px}
.ddlist small{display:block;color:var(--muted);font-size:12px}
.nonedit{background:var(--chip);border-radius:4px;height:30px;display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--text)}
.dot{width:16px;height:16px;border-radius:50%;background:#384349;color:#fff;font-size:8px;display:grid;place-items:center;font-weight:700}
.memo{background:var(--chip);border-radius:4px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;height:32px;font-weight:600}
.memo button{border:0;background:none;color:var(--blue);font-weight:600;font-size:12px}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dows{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.dows label{display:grid;justify-items:center;gap:2px;font-size:12px;color:var(--text-strong)}
.dows input{accent-color:var(--blue)}
.menu{position:fixed;z-index:70;background:#fff;border:1px solid var(--line);border-radius:4px;box-shadow:0 6px 18px rgb(0 0 0 / .14);padding:4px 0;min-width:190px}
.menu button{display:block;width:100%;border:0;background:#fff;text-align:left;padding:8px 16px;color:var(--text)}
.menu button:hover{background:var(--blue-tint)}
.menu .h{font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--muted);padding:8px 16px 4px}
.err{background:var(--err-bg);color:var(--err);border-radius:4px;padding:8px 10px;font-size:13px;margin-top:10px}
/* clients list */
.pagehead{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap;padding:16px 24px 0}
.pagehead .sub{color:var(--muted);font-size:12px;margin-top:4px}
.pagehead .sp{flex:1}
.notice{background:var(--badge);margin:16px 24px 0;border-radius:4px;padding:16px 52px;color:var(--text-strong)}
.util{display:flex;gap:8px;flex-wrap:wrap;padding:16px 24px;align-items:center}
.util .inp{width:264px}
.util .sp{flex:1}
.clist{margin:0 24px}
.chead,.crow{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1.5fr) minmax(0,1.3fr) minmax(64px,.6fr);gap:0 16px}
.crow > div{min-width:0;overflow-wrap:anywhere}
.chead{border-bottom:1px solid var(--line);font-size:12px;font-weight:600;color:var(--text-strong);padding:6px 0}
.crow{border-bottom:1px solid var(--line-soft);padding:20px 0;min-height:110px}
.crow .nm{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.crow .nm button{border:0;background:none;padding:0;color:var(--blue);font-weight:500;font-size:14px}
.crow .ct{font-size:12px;color:var(--text-strong);margin-top:10px;display:grid;gap:8px}
.crow .ct span{color:#708693;margin-left:6px;white-space:nowrap;overflow-wrap:normal}
.crow .bill b{font-weight:600}
.crow .bill div{margin-top:6px;color:var(--text)}
.crow .cl{font-size:12px;color:var(--text-strong)}
/* chart */
.chart-h{padding:16px 24px 0}
.chart-h .nm{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.chart-h .meta{display:flex;gap:16px;align-items:center;color:var(--text);margin-top:10px;flex-wrap:wrap}
.chart-h .meta a,.chart-h .meta button{border:0;background:none;padding:0;color:var(--blue);font-weight:600}
.chart-h .acts{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.nextline{margin-top:12px;color:var(--text);font-size:13px}
.nextline button{border:0;background:none;padding:0;color:var(--blue);font-weight:600}
.ctabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin:22px 24px 0;overflow-x:auto}
.ctabs button{border:0;background:none;padding:10px 0;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.ctabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.ctabs .n{background:var(--badge);border-radius:10px;padding:0 6px;font-size:11px;margin-left:4px;color:var(--text)}
.chartgrid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:32px;padding:20px 24px 40px}
.chartnote{border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--muted-2);min-height:64px}
.tl-filters{display:flex;gap:8px;align-items:center;margin:20px 0 6px;flex-wrap:wrap}
.tl-filters .sp{flex:1}
.yr{text-align:center;color:var(--muted);font-size:12px;margin:18px 0 10px}
.tli{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.tli .d{font-weight:600;color:var(--text-strong);font-size:13px}
.tli .w{color:var(--muted);font-size:13px}
.tli .ttl{font-weight:600;color:var(--text-strong)}
.tli button.lnk{border:0;background:none;padding:0;color:var(--blue);font-weight:600;text-align:left}
.side h3{font-size:16px;font-weight:600;color:var(--text-strong);margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.side h3 button{border:0;background:none;color:var(--blue);font-weight:600;font-size:13px;padding:0}
.side section{padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line-soft)}
.side .kv{display:flex;justify-content:space-between;padding:4px 0}
.side .lnk{border:0;background:none;padding:0;color:var(--blue);font-weight:600}
.doc{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line-soft)}
.doc .sp{flex:1;min-width:0}
.st-done{color:var(--ok);font-weight:600;font-size:12px}
.st-todo{color:var(--err);font-weight:600;font-size:12px}
.placeholder{padding:60px 24px;text-align:center;color:var(--muted)}
.placeholder h2{color:var(--text-strong);font-size:20px;font-weight:600;margin:0 0 8px}
/* dx/tx page + note page */
.form-w{max-width:725px}
.sect{font-size:16px;font-weight:600;color:var(--text-strong);margin:26px 0 12px}
.dxsel{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.dxsel span{background:var(--blue-tint);color:var(--blue-dark);border-radius:4px;padding:3px 8px;font-weight:600;font-size:13px;display:inline-flex;gap:8px;align-items:center}
.dxsel span button{border:0;background:none;color:inherit;padding:0;font-size:15px;line-height:1}
.rte{border:1px solid var(--line);border-radius:4px;background:#fff}
.rtebar{display:flex;gap:2px;padding:4px 6px;border-bottom:1px solid var(--line-soft)}
.rtebar button{width:26px;height:24px;border:0;background:transparent;border-radius:3px;color:var(--muted);font-weight:700;font-size:12.5px}
.rtebar button:hover{background:var(--btn2);color:var(--text-strong)}
.rtebar .rb-italic{font-style:italic;font-family:Georgia,serif}
.rtebar .rb-strikeThrough{text-decoration:line-through}
.rtein{min-height:64px;padding:8px 10px;outline:0;color:var(--text-strong);white-space:pre-wrap}
.rtein:focus{box-shadow:inset 0 0 0 2px var(--blue-tint)}
.rtein ul,.rtein ol{margin:0;padding-left:20px}
.formbtns{display:flex;gap:8px;align-items:center;margin:24px 0}
.formbtns .sp{flex:1}
.notepage{display:grid;grid-template-columns:minmax(0,923px) 376px;gap:24px;padding:0 24px 40px}
.nhead{display:flex;align-items:flex-start;gap:12px;padding:16px 24px 0}
.nhead .who{font-size:20px;font-weight:600;color:var(--text-strong)}
.nhead .sp{flex:1}

/* ---------- calendar ---------- */
const H0 = 6, H1 = 22;
function renderCalendar() {
  const ws = addDays(weekStart(NOW), ui.weekOff * 7);
  const days = Array.from({ length: 7 }, (_, i) => addDays(ws, i));
  const mobile = matchMedia('(max-width:860px)').matches;
  if (!days.some(d => dayKey(d) === ui.mday)) ui.mday = dayKey(days.find(d => dayKey(d) === TK) || days[1]);
  const shown = (mobile || ui.view === 'Day') ? days.filter(d => dayKey(d) === ui.mday) : days;
  const hourPx = 64;
  const labels = []; for (let h = H0; h < H1; h++) labels.push(`<div>${((h + 11) % 12) + 1} ${h < 12 ? 'am' : 'pm'}</div>`);
  const cols = shown.map(d => {
    const k = dayKey(d);
    let slots = ''; for (let m = H0 * 60; m < H1 * 60; m += 15) slots += `<button type="button" class="slot" data-slot="${k}|${m}" aria-label="New appointment ${fmtLong(k)} ${fmtTime(m)}" tabindex="-1"></button>`;
    const dayEvs = S.appts.filter(a => a.date === k).sort((a, b) => a.start - b.start || a.id.localeCompare(b.id));
    const lay = {}; let cluster = [], cEnd = -1;
    const flush = () => { const cols = []; cluster.forEach(a => { let i = cols.findIndex(end => end <= a.start); if (i < 0) { i = cols.length; cols.push(0); } cols[i] = a.start + a.dur; lay[a.id] = { i }; }); cluster.forEach(a => lay[a.id].n = cols.length); cluster = []; };
    dayEvs.forEach(a => { if (a.start >= cEnd) { flush(); cEnd = -1; } cluster.push(a); cEnd = Math.max(cEnd, a.start + a.dur); }); flush();
    const evs = dayEvs.map(a => {
      const c = C(a.clientId), top = (a.start - H0 * 60) / 60 * hourPx, h = a.dur / 60 * hourPx;
      const ly = lay[a.id], posStyle = ly.n > 1 ? `left:calc(${ly.i * 100 / ly.n}% + 1px);right:auto;width:calc(${100 / ly.n}% - 3px);` : '';
      const due = isPast(a) && a.status === 'Show' && !a.noteId;
      return `<button type="button" class="ev ${evClass(a)}" data-appt="${a.id}" style="${posStyle}top:${top}px;height:${h - 1}px"><span class="t">${fmtTime(a.start)}</span><span class="n">ST ${esc(nm(c))}</span>${due ? `<span class="ic" title="Add note">${I.note}</span>` : ''}</button>`;
    }).join('');
    const now = k === TK && NOWMIN > H0 * 60 && NOWMIN < H1 * 60 ? `<div class="nowl" style="top:${(NOWMIN - H0 * 60) / 60 * hourPx}px"></div>` : '';
    return `<div class="dcol ${k === TK ? 'today' : ''}">${slots}${evs}${now}</div>`;
  }).join('');
  return `<div class="calpage"><div class="calbar"><button type="button" class="tod" id="wkToday">Today</button><button type="button" class="arr" id="wkPrev" aria-label="Previous week">‹</button><button type="button" class="arr" id="wkNext" aria-label="Next week">›</button>
      <h2>${MON[ws.getMonth()].slice(0, 3)} ${ws.getFullYear()}</h2>
      <div class="views">${['Day', 'Week', 'Month'].map(v => `<button type="button" data-view="${v}" class="${ui.view === v || (v === 'Week' && ui.view === 'Month') ? 'on' : ''}">${v}</button>`).join('')}</div>
      <button type="button" class="btn chip">Color: Status</button></div>
    <div class="filters"><button type="button" class="btn chip on">Sample Therapist</button><button type="button" class="btn chip">All locations</button><button type="button" class="btn chip">More filters</button><button type="button" class="btn chip">Hide cancels</button></div>
    <div class="daytabs" role="group" aria-label="Pick a day">${days.map(d => { const k = dayKey(d); return `<button type="button" data-day="${k}" class="${k === ui.mday ? 'on' : ''}">${DOW[d.getDay()].slice(0, 3)} ${d.getDate()}</button>`; }).join('')}</div>
    <div class="cal" style="--days:${shown.length}" id="calView">
      <div class="calhead"><div></div>${shown.map(d => `<div class="${dayKey(d) === TK ? 'today' : ''}">${DOW[d.getDay()].slice(0, 3)} ${d.getDate()}</div>`).join('')}</div>
      <div class="allday"><div>all day</div>${shown.map(() => '<div></div>').join('')}</div>
      <div class="tgrid"><div class="tlabels">${labels.join('')}</div>${cols}</div>
    </div></div>`;
}

    <div class="seg2"><button type="button" class="on">Individual or couple</button><button type="button">Group</button></div>
    <div class="ddwrap field"><div class="row2"><button type="button" class="ddbtn ${c ? '' : 'ph'}" id="naClient" style="flex:1">${c ? esc(nm(c)) : 'Search Client'}</button><button type="button" class="btn link small">+ Create client</button></div>
      ${ui.dd === 'client' ? `<div class="ddlist"><div class="srch"><input class="inp" id="naClientQ" placeholder="Search" aria-label="Search client" value="${esc(ui.ncq || '')}" autocomplete="off"></div>${S.clients.filter(x => !ui.ncq || nm(x).toLowerCase().includes(ui.ncq.toLowerCase())).map(x => `<button type="button" data-pick-client="${x.id}">${esc(nm(x))}</button>`).join('')}</div>` : ''}</div>
    <div class="lab b">Appointment details</div>
    <div class="lrow" style="margin-bottom:10px"><label class="check"><input type="checkbox"> All day</label><button type="button" class="btn link small">Suggested times</button></div>
    <div class="field"><input class="inp" type="date" id="naDate" value="${st.date}" aria-label="Start date" style="width:160px"></div>
    <div class="row2 field"><select class="inp" id="naStart" style="width:130px" aria-label="Start time">${timeOpts(st.start)}</select><span>to</span><input class="inp" style="width:110px" value="${fmtTime(st.start + 53)}" readonly aria-label="End time"><input class="inp" style="width:48px" value="53" aria-label="Duration" readonly><span>min</span></div>
    ${c ? `<div class="field"><span class="lab">Clinician</span><div class="nonedit"><span class="dot">ST</span>Sample Therapist (You)</div></div>` : ''}
    <div class="field"><label class="lab" for="naLoc">Location</label><select class="inp" id="naLoc">${LOCATIONS.map((l, i) => `<option ${i === 1 ? 'selected' : ''}>${l}</option>`).join('')}</select></div>
    <label class="check"><input type="checkbox" id="naRec" ${st.rec ? 'checked' : ''}> Recurring</label>
    ${st.rec ? `<div style="padding:8px 0 4px 12px"><div class="row2"><span>Every</span><select class="inp" id="naEvery" style="width:64px">${[1, 2, 3, 4].map(n => `<option ${st.recv && st.recv.every === n ? 'selected' : ''}>${n}</option>`).join('')}</select><select class="inp" id="naPeriod" style="width:100px">${['week', 'month', 'year'].map(x => `<option ${st.recv && st.recv.period === x ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
      <div class="dows">${['S', 'M', 'T', 'W', 'T', 'F', 'S'].map((l, i) => `<label>${l}<input type="checkbox" data-dow="${i}" aria-label="${DOW[i]}" ${(rv ? rv.days.includes(i) : i === dow) ? 'checked' : ''}></label>`).join('')}</div>
      <div class="row2"><span>Ends</span><select class="inp" id="naEndType" style="width:100px"><option>After</option><option>On Date</option></select><select class="inp" id="naEndCount" style="width:84px">${Array.from({ length: 30 }, (_, i) => `<option ${i + 1 === (st.recv ? st.recv.count : 30) ? 'selected' : ''}>${i + 1}</option>`).join('')}</select><span>events</span></div></div>` : ''}
    ${c ? `<div class="memo" style="margin-top:14px"><span>Memo</span><button type="button">Add memo</button></div>
    <hr class="sep"><div class="lab b">Services and modifiers</div>
    <select class="inp" id="naService" aria-label="Services"><option value="">Select service</option>${SERVICES.map(([k, n]) => `<option value="${k}">${k} ${n}</option>`).join('')}</select>
    <div class="row2" style="margin-top:8px">${[1, 2, 3, 4].map(i => `<input class="inp" style="width:84px" placeholder="" aria-label="Modifier ${i}">`).join('')}</div>
    <div class="row2" style="margin-top:8px"><span>Units</span><input class="inp" style="width:60px" value="1" aria-label="Number of Units"><span style="margin-left:auto">Fee</span></div>
    <button type="button" class="btn link small" style="padding:0;margin-top:8px">Add service</button>
    <hr class="sep"><div class="lrow"><span class="lab b" style="margin:0">Billing</span><span>${c.billing}</span></div><div class="lrow" style="margin-top:4px"><span>Appointment Fee</span><span>$150</span></div>` : ''}
    <div id="naErr"></div></div>
    <div class="foot2"><span class="sp"></span><button type="button" class="btn link" data-close>Cancel</button><button type="button" class="btn primary" id="naSave">Save</button></div></div>`;
  const keepScroll = $('#layer .pop .body')?.scrollTop || 0;
  const prevPos = $('#layer .pop') ? { l: $('#layer .pop').style.left, t: $('#layer .pop').style.top, h: $('#layer .pop').style.maxHeight } : null;
  $('#layer').innerHTML = html;
  const pop = $('#layer .pop');
  if (prevPos) { pop.style.left = prevPos.l; pop.style.top = prevPos.t; pop.style.maxHeight = prevPos.h; } else place(pop, anchor);
  fit(pop);
  $('#layer .pop .body').scrollTop = keepScroll;
  if (ui.dd === 'client') { const q = $('#naClientQ'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  highlight();
}
function readNew() {
  const st = L.st, oldDate = st.date;
  st.date = $('#naDate').value || st.date; st.start = +$('#naStart').value;
  st.loc = $('#naLoc').value; st.code = $('#naService')?.value || '';
  if (st.rec) st.recv = { every: +$('#naEvery').value, period: $('#naPeriod').value, days: $$('[data-dow]').filter(x => x.checked).map(x => +x.dataset.dow), endType: $('#naEndType').value, count: +$('#naEndCount').value, date: oldDate };
}
function saveNew() {
  readNew(); const st = L.st, err = $('#naErr');
  const probs = []; if (!st.cid) probs.push('choose a client'); if (!st.code) probs.push('select a service');
  if (probs.length) { err.innerHTML = `<div class="err">To save, ${probs.join(' and ')}.</div>`; return; }
  const rec = st.rec ? st.recv : null;
  const Ls = ui.lesson && LESSONS.find(l => l.id === ui.lesson), lst = Ls && Ls.steps[ui.step];
  if (lst && lst.on === 'appt-saved') {
    const v = lst.test({ appt: { clientId: st.cid, date: st.date, start: st.start, code: st.code }, rec });
    if (v !== true) { ui.fb = v; renderGuide(); err.innerHTML = `<div class="err">${esc(v)}</div>`; return; }
  }
  const made = [];
  if (rec) {
    const days = rec.days.length ? rec.days : [parseDay(st.date).getDay()];
    let d = parseDay(st.date), guard = 0;
    while (made.length < rec.count && guard++ < 800) {
      const ws = weekStart(d), wk = Math.round((ws - weekStart(parseDay(st.date))) / 6048e5);
      if (days.includes(d.getDay()) && dayKey(d) >= st.date && (rec.period !== 'week' || wk % rec.every === 0)) made.push(dayKey(d));
      d = addDays(d, 1);
      if (rec.period !== 'week') break;
    }
    if (!made.length) made.push(st.date);
  } else made.push(st.date);
  const sid = rec ? uid('s') : null;
  made.forEach((k, i) => S.appts.push({ id: uid('a'), clientId: st.cid, date: k, start: st.start, dur: 53, code: i && st.code === '90791' ? '90837' : st.code, location: st.loc, status: 'Show', series: sid }));
  const first = S.appts[S.appts.length - made.length];
  const c = C(st.cid); if (c.status === 'Prospective') c.status = 'Active';
  closeLayer(); ui.page = 'calendar'; showDate(st.date); render();
  toast(made.length > 1 ? `${made.length} appointments scheduled for ${nm(c)}` : `Appointment scheduled for ${nm(c)}`);
  emit('appt-saved', { appt: first, rec: rec ? { ...rec, count: made.length } : null });
}
function toast(t) { $('#toastRoot').innerHTML = `<div class="toast">${esc(t)}</div>`; clearTimeout(toast.t); toast.t = setTimeout(() => $('#toastRoot').innerHTML = '', 2600); }

/* ---------- note actions ---------- */
function readNoteDraft() {
  const d = ui.ndraft; if (!d || d.tpl !== 'Tangible Progress Note') return;
  $$('[data-nf]').forEach(t => d.f[t.dataset.nf] = t.value.trim());
  const ch = {}; $$('[data-nc]').forEach(x => { if (x.checked) { const [g, o] = x.dataset.nc.split('|'); (ch[g] = ch[g] || []).push(o); } }); d.f.checks = ch;
}
function signNote() {
  readNoteDraft(); const d = ui.ndraft, err = $('#noteErr');
  if (d.tpl !== 'Tangible Progress Note') { err.innerHTML = '<div class="err">Choose the Tangible Progress Note template before signing.</div>'; emit('signed', { tpl: d.tpl }); return; }
  const f = d.f, miss = [];
  if (!f.content) miss.push('Content or Topics Discussed'); if (!f.approach) miss.push('Approach for Next Session');
  const risk = f.checks['Risk Factors'] || []; if (!risk.length) miss.push('a Risk Factors box (None if no risk)');
  if (risk.some(r => r !== 'None') && !f.safety) miss.push('how safety factors were addressed');
  if (!(f.checks.Interventions || []).length) miss.push('at least one Intervention');
  if (miss.length) { err.innerHTML = `<div class="err">Still needed: ${miss.join(', ')}.</div>`; return; }
  const a = A(ui.apptId);
  const n = { id: uid('n'), apptId: a.id, clientId: a.clientId, tpl: d.tpl, f: JSON.parse(JSON.stringify(f)), date: a.date };
  S.notes.push(n); a.noteId = n.id; ui.ndraft = null;
  render(); toast('Note signed'); emit('signed', { tpl: n.tpl });
}

/* ---------- dx/tx actions ---------- */
function readPlan() {
  const D = ui.dxtx; if (!D || !D.plan) return;
  const p = D.plan;
  $$('[data-pf]').forEach(x => { p[x.dataset.pf] = x.value.trim(); });
  $$('[data-prt]').forEach(x => { p[x.dataset.prt] = x.innerText.trim(); });
}
function saveDxTx() {
  readPlan(); const D = ui.dxtx, err = $('#dxtxErr');
  if (!D.dx.length && !D.tpl) { err.innerHTML = '<div class="err">Select a diagnosis or a treatment plan template before saving.</div>'; emit('dxtx-saved', { clientId: D.cid, dx: D.dx, plan: null }); return; }
  const plan = D.tpl === 'Basic' ? D.plan : null;
  const payload = { clientId: D.cid, dx: [...D.dx], plan };
  const Ls = ui.lesson && LESSONS.find(l => l.id === ui.lesson), st = Ls && Ls.steps[ui.step];
  if (st && st.on === 'dxtx-saved') { const v = st.test(payload); if (v !== true) { ui.fb = v; renderGuide(); err.innerHTML = `<div class="err">${esc(v)}</div>`; return; } }
  S.dx[D.cid] = [...D.dx]; S.dxDate = S.dxDate || {}; S.dxDate[D.cid] = TK;
  if (plan) S.plans[D.cid] = { tpl: D.tpl, ...plan, date: TK };
  const cid = D.cid; ui.dxtx = null; ui.dd = null; ui.dxQ = '';
  openClient(cid); toast('Diagnosis and treatment plan saved');
  emit('dxtx-saved', payload);
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-close], a, label');
  if (L && L.kind === 'menu' && !e.target.closest('.menu') && t?.id !== 'topCreate' && t?.id !== 'chartNew' && t?.id !== 'statusBtn') closeLayer();
  if (!t) {
    if (L && (L.kind === 'appt' || L.kind === 'new') && !e.target.closest('.pop')) { closeLayer(); highlight(); }
    if (ui.dd && !e.target.closest('.ddwrap')) { ui.dd = null; L && L.kind === 'new' ? drawNew() : render(); }
    return;
  }
  const d = t.dataset;
  if (d.close !== undefined) { closeLayer(); ui.dd = null; return render(); }
  if (d.nav) return go(d.nav);
  if (d.openClient) return openClient(d.openClient);
  if (d.ctab) { ui.ctab = d.ctab; render(); return emit('ctab', { tab: d.ctab }); }
  if (d.lesson) return startLesson(d.lesson);
  if (d.slot) { const [k, m] = d.slot.split('|'); ui.dd = null; return newApptPopover({ date: k, start: +m, fromSlot: true }, t); }
  if (d.appt) { ui.dd = null; return apptPopover(d.appt, t); }
  if (d.day) { ui.mday = d.day; return render(); }
  if (d.view) { ui.view = d.view; return render(); }
  if (d.openAppt) { ui.page = 'appt'; ui.apptId = d.openAppt; ui.ndraft = null; ui.psy = false; render(); return emit('note-page', { id: d.openAppt }); }
  if (d.openDxtx) return openDxTx(d.openDxtx);
  if (d.backCal) { ui.page = 'calendar'; return showDate(d.backCal), render(); }
  if (d.schedule) return newApptPopover({ cid: d.schedule }, null);
  if (d.create) { closeLayer(); if (d.create === 'appt') return newApptPopover({}, null); return toast('Not part of the practice sandbox'); }
  if (d.new) { closeLayer(); if (d.new === 'dxtx') return openDxTx(ui.clientId); return toast('Not part of the practice sandbox'); }
  if (d.status) {
    const a = A(L.id); a.status = d.status; { const fv = $('#apptFee'); ui.feeDraft = fv && fv.value !== '' && !isNaN(+fv.value) ? { id: a.id, v: +fv.value } : null; } const id = a.id, anchor = $(`[data-appt="${id}"]`);
    render(); apptPopover(id, $(`[data-appt="${id}"]`) || anchor); toast('Status changed to ' + d.status);
    return emit('status', { id, status: d.status });
  }
  if (d.pickClient) { L.st.cid = d.pickClient; ui.dd = null; ui.ncq = ''; readNewSafe(); drawNew(); return emit('client-picked', { id: d.pickClient }); }
  if (d.dx) { if (!ui.dxtx.dx.includes(d.dx)) ui.dxtx.dx.push(d.dx); readPlan(); ui.dd = null; ui.dxQ = ''; return render(); }
  if (d.dxrm) { readPlan(); ui.dxtx.dx = ui.dxtx.dx.filter(x => x !== d.dxrm); return render(); }
  if (d.rte) { e.preventDefault(); const ed = t.closest('.rte').querySelector('.rtein'); ed.focus(); document.execCommand(d.rte); return; }
  if (d.ptpl) { readPlan(); ui.dxtx.tpl = d.ptpl; if (d.ptpl === 'Basic' && !ui.dxtx.plan) ui.dxtx.plan = blankPlan(); ui.dd = null; render(); return emit('plan-tpl', { tpl: d.ptpl }); }
  if (d.ntpl) { readNoteDraft(); ui.ndraft.tpl = d.ntpl; ui.dd = null; render(); return emit('tpl', { tpl: d.ntpl }); }
  if (d.quiz) { const [i, o] = d.quiz.split('|'); ui.quiz[i] = o; renderGuide(); if (QUIZ.every((q, j) => ui.quiz[j] === q.a)) emit('quiz', {}); return; }
  switch (t.id) {
    case 'navToggle': ui.navOpen = !ui.navOpen; render(); return emit('navtoggle', { open: ui.navOpen });
    case 'topCreate': return L && L.kind === 'menu' ? closeLayer() : showMenu(t, '<button type="button" data-create="client">Create client</button><button type="button" data-create="appt">Schedule appointment</button><button type="button" data-create="avail">Add availability</button>');
    case 'chartNew': return L && L.kind === 'menu' ? closeLayer() : showMenu(t, '<button type="button" data-new="dxtx">Diagnosis and treatment plan</button><button type="button" data-new="gfe">Good faith estimate</button><button type="button" data-new="mse">Mental status exam</button><button type="button" data-new="measure">Scored measure</button><button type="button" data-new="other">Other document</button>');
    case 'statusBtn': { const a = A(L.id); const pop = $('#layer .pop'); const r = t.getBoundingClientRect(); const m = document.createElement('div'); m.className = 'menu'; m.setAttribute('role', 'menu'); m.innerHTML = STATUSES.map(s => `<button type="button" data-status="${s}" style="${s === a.status ? 'color:var(--ev-show-t);font-weight:600' : ''}">${s}</button>`).join(''); $$('#layer .menu').forEach(x => x.remove()); $('#layer').appendChild(m); m.style.top = (r.bottom + 4) + 'px'; m.style.left = r.left + 'px'; return highlight(); }
    case 'popSave': { const a = A(L.id), v = +$('#apptFee').value;
      { const Ls = ui.lesson && LESSONS.find(l => l.id === ui.lesson), st = Ls && Ls.steps[ui.step]; if (st && st.on === 'fee-saved') { const r = st.test({ id: a.id, status: a.status, fee: v }); if (r !== true) { ui.fb = r; renderGuide(); return highlight(); } } }
      a.fee = isNaN(v) ? a.fee : v; const id = a.id; closeLayer(); render(); toast('Appointment saved'); return emit('fee-saved', { id, status: a.status, fee: a.fee }); }
    case 'popAddNote': { const id = L.id; closeLayer(); ui.page = 'appt'; ui.apptId = id; ui.ndraft = null; ui.psy = false; render(); return emit('note-page', { id }); }
    case 'wkPrev': ui.weekOff--; render(); return emit('week', { off: ui.weekOff });
    case 'wkNext': ui.weekOff++; render(); return emit('week', { off: ui.weekOff });
    case 'wkToday': ui.weekOff = 0; ui.mday = TK; render(); return emit('week', { off: 0 });
    case 'sideSchedule': return newApptPopover({ cid: ui.clientId }, null);
    case 'sendReminder': S.reminders[ui.clientId] = true; render(); toast('Reminder sent (sandbox only)'); return emit('reminder', { id: ui.clientId });
    case 'naClient': readNewSafe(); ui.dd = ui.dd === 'client' ? null : 'client'; return drawNew();
    case 'naSave': return saveNew();
    case 'dxSelect': readPlan(); ui.dd = ui.dd === 'dx' ? null : 'dx'; return render();
    case 'tplBtn': readPlan(); ui.dd = ui.dd === 'tpl' ? null : 'tpl'; return render();
    case 'dxtxSave': return saveDxTx();
    case 'loadLastPlan': { readPlan(); const prev = S.plans[ui.dxtx.cid]; if (!prev) return toast('There is no previous plan for this client.'); ui.dxtx.tpl = 'Basic'; ui.dxtx.plan = JSON.parse(JSON.stringify({ ...blankPlan(), ...prev })); render(); return emit('plan-tpl', { tpl: 'Basic' }); }
    case 'noteTplBtn': readNoteDraft(); ui.dd = ui.dd === 'ntpl' ? null : 'ntpl'; return render();
    case 'loadLast': {
      readNoteDraft(); const a = A(ui.apptId);
      const prev = S.notes.filter(n => n.clientId === a.clientId && n.tpl === 'Tangible Progress Note').sort((x, y) => y.date.localeCompare(x.date))[0];
      if (!prev) return toast('No previous note for this client yet.');
      ui.ndraft = { tpl: 'Tangible Progress Note', f: JSON.parse(JSON.stringify(prev.f)) }; render(); toast('Loaded the ' + fmtShort(prev.date) + ' note. Update it for today.');
      return emit('tpl', { tpl: 'Tangible Progress Note' });
    }
    case 'signNote': return signNote();
    case 'addPsy': ui.psy = !ui.psy; readNoteDraft(); return render();
    case 'resetBtn':
      if (!t.classList.contains('armed')) { t.classList.add('armed'); t.textContent = 'Click again to reset'; setTimeout(() => { t.classList.remove('armed'); t.textContent = 'Reset sandbox'; }, 3500); return; }
      S = seed(); P = { done: {} }; Object.assign(ui, { page: 'calendar', clientId: null, ctab: 'overview', apptId: null, weekOff: 0, mday: TK, lesson: null, step: 0, fb: null, quiz: {}, dxtx: null, ndraft: null, dd: null });
      t.classList.remove('armed'); t.textContent = 'Reset sandbox'; closeLayer(); render(); return toast('Sandbox reset with fresh sample clients');
    case 'guideMin': ui.guideMin = !ui.guideMin; renderGuide(); { const pp = $('#layer .pop'); if (pp) fit(pp); } return;
    case 'gExit': ui.lesson = null; ui.fb = null; renderGuide(); return highlight();
    case 'gSkip': return advance();
    case 'gShow': { const st = LESSONS.find(l => l.id === ui.lesson).steps[ui.step]; if (st.go) st.go(); render(); if (!curTarget()) toast('Close the open window first, then try again.'); return highlight(true); }
  }
});
function readNewSafe() { try { readNew(); } catch (e) {} }
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'naRec') { readNewSafe(); L.st.rec = t.checked; return drawNew(); }
  if (t.id === 'naDate' || t.id === 'naStart') { readNewSafe(); return drawNew(); }
});
document.addEventListener('mousedown', e => { if (e.target.closest('.rtebar button')) e.preventDefault(); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'dxSearch') { ui.dxQ = t.value; $('#dxResults').innerHTML = dxResults(); return highlight(); }
  if (t.id === 'naClientQ') { ui.ncq = t.value; readNewSafe(); return drawNew(); }
  if (t.id === 'clientSearch') { ui.clientQ = t.value; const pos = t.selectionStart; render(); const s = $('#clientSearch'); s.focus(); s.setSelectionRange(pos, pos); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (ui.dd) { ui.dd = null; L && L.kind === 'new' ? drawNew() : render(); } else if (L) { closeLayer(); highlight(); } } });
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (ui.page === 'calendar') render(); const pp = $('#layer .pop'); if (pp) fit(pp); }, 150); });

render();
})();
</script>
